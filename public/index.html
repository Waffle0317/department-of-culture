<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Department of Culture</title>
  <style>
    :root { --bg: #f4f1ea; --ink: #1d1a16; --rule: #8a7f6a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1d1a16; --ink: #f4f1ea; --rule: #8a7f6a; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
    main { text-align: center; padding: 0 16px; }
    h1 { font-weight: normal; letter-spacing: .08em; text-transform: uppercase; font-size: 1.4rem; margin: 0 0 .5rem; }
    hr { width: 4rem; border: 0; border-top: 1px solid var(--rule); margin: 1rem auto; }
    p { margin: 0; font-style: italic; }
  </style>
</head>
<body>
  <main>
    <h1>Department of Culture</h1>
    <hr>
    <p>Site under construction.</p>
  </main>
</body>
</html>
